    {
      "@context": "https://schema.org",

      "mainEntity": [
        {
          "@type": "Question",
          "name": "Como solicito uma cotação para a minha loja?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Envie pelo WhatsApp (48) 99868-0025 a relação de itens e as quantidades estimadas. A Bedin devolve cotação em até 24 horas úteis com preço, disponibilidade e condições de pagamento. Não há custo nem compromisso."
          }
        },
        {
          "@type": "Question",
          "name": "Preciso ter CNPJ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. A Bedin é uma representação comercial e atende exclusivamente lojas e empresas do varejo e do atacado — não vende para consumidor final."
          }
        },
        {
          "@type": "Question",
          "name": "Qual é o pedido mínimo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O mínimo varia conforme a indústria e a categoria. Como a Bedin consolida o pedido entre vários fornecedores, na prática a sua loja costuma atingir o mínimo com mais facilidade do que comprando direto de cada um."
          }
        },
        {
          "@type": "Question",
          "name": "Quais categorias a Bedin representa?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "São mais de 1.000 itens em 8 categorias: frutas secas, especiarias, grãos, sementes, chás, chips, drageados e farináceos — de mais de 30 indústrias parceiras selecionadas por qualidade e regularidade de entrega."
          }
        },
        {
          "@type": "Question",
          "name": "A Bedin atende em todo o Brasil?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. A Bedin abastece lojas em todo o território nacional, atendendo mais de 200 empresas por mês desde 2016. A sede fica em Biguaçu, Santa Catarina."
          }
        },
        {
          "@type": "Question",
          "name": "Como funciona o frete?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A Bedin agrupa os itens de fornecedores diferentes em uma única operação logística e apresenta as opções de transporte, custo e prazo antes de você fechar o pedido. Você aprova o frete junto com a cotação."
          }
        }
      ]
    }
